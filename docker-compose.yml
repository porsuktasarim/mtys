version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mera-app
    ports:
      - "8569:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/merakanunu
      - SESSION_SECRET=mera-kanunu-gizli-anahtar-2024
      - NODE_ENV=production
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mera-network

  mongo:
    image: mongo:7.0
    container_name: mera-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - mera-network

  mongo-express:
    image: mongo-express:1.0.2
    container_name: mera-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017/
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mera-network

volumes:
  mongo_data:
  uploads_data:

networks:
  mera-network:
    driver: bridge
